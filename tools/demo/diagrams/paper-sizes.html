<!doctype html>
<html lang="ko">
<meta charset="utf-8" />
<style>
  body { margin: 0; font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; background: #fff; color: #1f2937; }
  #d { width: 1160px; padding: 36px 40px 40px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 28px; align-items: end; }
  .card { text-align: center; }
  .stage { height: 380px; display: flex; align-items: flex-end; justify-content: center; }
  .paper { background: #16324f; border-radius: 6px; position: relative; display: grid; gap: 7px; padding: 9px; box-sizing: border-box; }
  .slot { background: repeating-conic-gradient(#e5e7eb 0% 25%, #fff 0% 50%) 0 0 / 14px 14px; border-radius: 2px; }
  .foot { color: #fff; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; letter-spacing: .5px; }
  h3 { margin: 18px 0 4px; font-size: 22px; }
  .px { font-size: 19px; font-weight: 700; color: #b45309; }
  .sub { font-size: 15px; color: #6b7280; margin-top: 4px; }
</style>
<div id="d">
  <div class="card">
    <div class="stage"><div class="paper" style="width:120px;height:360px;grid-template-rows:repeat(4,1fr) 40px"><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="foot">LOGO</div></div></div>
    <h3>2×6 (세로)</h3><div class="px">1200 × 3600 px</div><div class="sub">세로로 긴 띠 모양</div>
  </div>
  <div class="card">
    <div class="stage"><div class="paper" style="width:240px;height:360px;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr 44px"><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="foot" style="grid-column:1/3">LOGO</div></div></div>
    <h3>4×6 (세로)</h3><div class="px">2400 × 3600 px</div><div class="sub">세로로 선 엽서 모양</div>
  </div>
  <div class="card">
    <div class="stage"><div class="paper" style="width:270px;height:180px;grid-template-columns:1fr 1fr 44px;grid-template-rows:1fr 1fr"><div class="slot" style="grid-column:1;grid-row:1"></div><div class="slot" style="grid-column:2;grid-row:1"></div><div class="slot" style="grid-column:1;grid-row:2"></div><div class="slot" style="grid-column:2;grid-row:2"></div><div class="foot" style="grid-column:3;grid-row:1/3;writing-mode:vertical-rl">LOGO</div></div></div>
    <h3>6×4 (가로)</h3><div class="px">3600 × 2400 px</div><div class="sub">가로로 누운 엽서 모양</div>
  </div>
  <div class="card">
    <div class="stage"><div class="paper" style="width:270px;height:90px;grid-template-columns:repeat(4,1fr) 40px"><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="foot" style="writing-mode:vertical-rl">LOGO</div></div></div>
    <h3>6×2 (가로)</h3><div class="px">3600 × 1200 px</div><div class="sub">가로로 긴 띠 모양</div>
  </div>
</div>
</html>
